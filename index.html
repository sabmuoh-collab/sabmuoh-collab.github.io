<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMBER | Luxury Perfumes</title>
<meta name="description" content="AMBER - luxury perfumes delivered to your door.">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0d0b09;
    color: #f3ead8;
    font-family: Georgia, "Times New Roman", serif;
    text-align: center;
  }
  header {
    padding: 22px 16px;
    border-bottom: 1px solid #3a3226;
    letter-spacing: 8px;
    font-size: 22px;
    color: #c9a24b;
  }
  .hero {
    padding: 90px 24px 100px;
  }
  .hero h1 {
    font-weight: normal;
    font-size: 40px;
    letter-spacing: 6px;
    color: #c9a24b;
  }
  .hero p {
    margin-top: 18px;
    font-size: 17px;
    color: #cdbfa5;
    font-style: italic;
  }
  .btn {
    display: inline-block;
    margin-top: 36px;
    padding: 14px 34px;
    border: 1px solid #c9a24b;
    color: #c9a24b;
    text-decoration: none;
    letter-spacing: 3px;
    font-size: 14px;
  }
  footer {
    padding: 24px;
    font-size: 12px;
    color: #7d725e;
    border-top: 1px solid #3a3226;
  }
</style>
</head>
<body>
  <header>AMBER</header>
  <section class="hero">
    <h1>AMBER</h1>
    <p>Luxury perfumes, delivered to your door</p>
    <a class="btn" href="#">COMING SOON</a>

  <footer>&copy; 2026 AMBER. All rights reserved.</footer>

</html>
