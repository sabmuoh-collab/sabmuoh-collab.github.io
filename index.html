<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AMBER | Luxury Perfumes</title>
<meta name="description" content="AMBER - luxury perfumes delivered to your door in Mauritania.">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0d0b09;color:#f3ead8;font-family:Georgia,"Times New Roman",serif}
header{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:1px solid #3a3226;position:sticky;top:0;background:#0d0b09;z-index:5}
.logo{letter-spacing:8px;font-size:22px;color:#c9a24b}
.cartbtn{background:none;border:1px solid #c9a24b;color:#c9a24b;padding:9px 16px;font-family:inherit;font-size:14px;letter-spacing:2px}
.hero{text-align:center;padding:60px 24px}
.hero h1{font-weight:normal;font-size:34px;letter-spacing:5px;color:#c9a24b}
.hero p{margin-top:14px;color:#cdbfa5;font-style:italic}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 16px 20px}
.filters button{background:none;border:1px solid #3a3226;color:#cdbfa5;padding:8px 16px;font-family:inherit;font-size:13px}
.filters button.on{border-color:#c9a24b;color:#c9a24b}
.grid{display:grid;grid-template-columns:1fr;gap:18px;padding:0 16px 40px;max-width:900px;margin:auto}
@media(min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{border:1px solid #3a3226;padding:16px;background:#14110d}
.pic{height:170px;background:linear-gradient(135deg,#2a2218,#14110d);display:flex;align-items:center;justify-content:center;font-size:60px;margin-bottom:12px;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.card h3{font-weight:normal;color:#c9a24b;letter-spacing:2px;font-size:18px}
.brand{font-size:12px;color:#7d725e;letter-spacing:2px;margin:4px 0 8px}
.notes{font-size:13px;color:#cdbfa5;line-height:1.6;margin-bottom:10px}
.price{font-size:18px;margin-bottom:4px}
.old{text-decoration:line-through;color:#7d725e;font-size:14px;margin-left:8px}
.stock{font-size:12px;margin-bottom:12px}
.in{color:#7fbf7f}.out{color:#d46a6a}
.add{width:100%;background:#c9a24b;color:#0d0b09;border:0;padding:12px;font-family:inherit;font-size:14px;letter-spacing:2px}
.add:disabled{background:#3a3226;color:#7d725e}
#panel{position:fixed;inset:0;background:#0d0b09;z-index:10;overflow-y:auto;padding:18px;display:none}
#panel.open{display:block}
#panel h2{font-weight:normal;color:#c9a24b;letter-spacing:3px;margin-bottom:16px}
.line{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3a3226;padding:10px 0;font-size:14px}
.qty button{background:none;border:1px solid #3a3226;color:#f3ead8;width:30px;height:30px;font-size:16px}
.qty span{margin:0 8px}
label{display:block;margin:14px 0 6px;font-size:13px;color:#cdbfa5}
input,select,textarea{width:100%;padding:12px;background:#14110d;border:1px solid #3a3226;color:#f3ead8;font-family:inherit;font-size:16px}
.total{font-size:18px;margin:18px 0;color:#c9a24b}
.send{width:100%;background:#25a244;color:#fff;border:0;padding:15px;font-size:16px;font-family:inherit}
.close{background:none;border:0;color:#cdbfa5;margin-top:14px;width:100%;padding:10px;font-family:inherit;font-size:14px}
footer{text-align:center;padding:24px;font-size:12px;color:#7d725e;border-top:1px solid #3a3226}
</style>
</head>
<body>
<header>
  <div class="logo">AMBER</div>
  <button class="cartbtn" onclick="openCart()">CART (<span id="count">0</span>)</button>
</header>

<section class="hero">
  <h1>AMBER</h1>
  <p>Luxury perfumes, delivered to your door</p>
</section>

<div class="filters" id="filters"></div>
<div class="grid" id="grid"></div>

<div id="panel">
  <h2>YOUR CART</h2>
  <div id="items"></div>
  <div class="total" id="total"></div>
  <div id="form">
    <label>Your name</label>
    <input id="name" placeholder="Full name">
    <label>Delivery option</label>
    <select id="delivery">
      <option>Delivery in Nouakchott</option>
      <option>Pickup from store</option>
      <option>Delivery to another city</option>
    </select>
    <label>Address / area</label>
    <textarea id="address" rows="2" placeholder="Neighborhood, street, landmark"></textarea>
    <label>Payment method</label>
    <select id="payment">
      <option>Cash on delivery</option>
      <option>Bankily</option>
      <option>Masrvi</option>
      <option>Bank transfer</option>
    </select>
    <br><br>
    <button class="send" onclick="sendOrder()">SEND ORDER ON WHATSAPP</button>
  </div>
  <button class="close" onclick="closeCart()">&larr; Continue shopping</button>
</div>

<footer>&copy; 2026 AMBER. All rights reserved.</footer>

<script>
// ===== SETTINGS =====
var PHONE = "221789607050";
var CURRENCY = "MRU";

// ===== YOUR PRODUCTS (edit this list) =====
var products = [
  {id:1, name:"Amber Noir", brand:"AMBER", category:"Unisex", occasion:"Evening", type:"Oriental",
   top:"Bergamot", middle:"Rose, Saffron", base:"Amber, Oud",
   price:2500, oldPrice:3000, stock:10, image:""},
  {id:2, name:"Rose Royale", brand:"AMBER", category:"Women", occasion:"Wedding", type:"Floral",
   top:"Pink pepper", middle:"Damask rose", base:"Musk, Vanilla",
   price:2800, oldPrice:0, stock:5, image:""},
  {id:3, name:"Oud Prestige", brand:"AMBER", category:"Men", occasion:"Special occasion", type:"Woody",
   top:"Cardamom", middle:"Leather", base:"Oud, Sandalwood",
   price:3500, oldPrice:0, stock:0, image:""},
  {id:4, name:"Citrus Dawn", brand:"AMBER", category:"Unisex", occasion:"Daily", type:"Fresh",
   top:"Lemon, Mint", middle:"Jasmine", base:"White musk",
   price:1800, oldPrice:2000, stock:20, image:""}
];

// ===== STORE CODE (no need to edit below) =====
var cart = {};
var filter = "All";
try { cart = JSON.parse(localStorage.getItem("amberCart") || "{}"); } catch(e) {}

function save(){ try { localStorage.setItem("amberCart", JSON.stringify(cart)); } catch(e) {} }
function find(id){ return products.filter(function(p){return p.id==id})[0]; }
function fmt(n){ return n.toLocaleString("en-US") + " " + CURRENCY; }

function drawFilters(){
  var cats = ["All","Women","Men","Unisex"];
  document.getElementById("filters").innerHTML = cats.map(function(c){
    return '<button class="'+(c==filter?'on':'')+'" onclick="setFilter(\''+c+'\')">'+c+'</button>';
  }).join("");
}
function setFilter(c){ filter=c; drawFilters(); drawProducts(); }

function drawProducts(){
  var list = products.filter(function(p){ return filter=="All" || p.category==filter; });
  document.getElementById("grid").innerHTML = list.map(function(p){
    var pic = p.image ? '<img src="'+p.image+'" alt="'+p.name+'">' : '&#129524;';
    var old = p.oldPrice>p.price ? '<span class="old">'+fmt(p.oldPrice)+'</span>' : '';
    var st = p.stock>0 ? '<div class="stock in">In stock</div>' : '<div class="stock out">Out of stock</div>';
    return '<div class="card"><div class="pic">'+pic+'</div>'+
      '<h3>'+p.name+'</h3><div class="brand">'+p.brand+' &bull; '+p.category+' &bull; '+p.type+'</div>'+
      '<div class="notes">Top: '+p.top+'<br>Heart: '+p.middle+'<br>Base: '+p.base+'<br>Occasion: '+p.occasion+'</div>'+
      '<div class="price">'+fmt(p.price)+old+'</div>'+st+
      '<button class="add" '+(p.stock>0?'':'disabled')+' onclick="add('+p.id+')">'+(p.stock>0?'ADD TO CART':'SOLD OUT')+'</button></div>';
  }).join("");
}

function add(id){
  var p = find(id);
  cart[id] = Math.min((cart[id]||0)+1, p.stock);
  save(); update();
}
function change(id,d){
  var p = find(id);
  cart[id] = (cart[id]||0)+d;
  if(cart[id]<=0) delete cart[id];
  else if(cart[id]>p.stock) cart[id]=p.stock;
  save(); update(); drawCart();
}
function totalQty(){ var n=0; for(var k in cart) n+=cart[k]; return n; }
function totalPrice(){ var t=0; for(var k in cart) t+=find(k).price*cart[k]; return t; }
function update(){ document.getElementById("count").textContent = totalQty(); }

function drawCart(){
  var html="";
  for(var k in cart){
    var p=find(k);
    html+='<div class="line"><div>'+p.name+'<br><small>'+fmt(p.price)+'</small></div>'+
      '<div class="qty"><button onclick="change('+k+',-1)">-</button><span>'+cart[k]+'</span><button onclick="change('+k+',1)">+</button></div></div>';
  }
  document.getElementById("items").innerHTML = html || "<p>Your cart is empty.</p>";
  document.getElementById("total").textContent = totalQty()? "Total: "+fmt(totalPrice()) : "";
  document.getElementById("form").style.display = totalQty()? "block":"none";
}
function openCart(){ drawCart(); document.getElementById("panel").className="open"; window.scrollTo(0,0); }
function closeCart(){ document.getElementById("panel").className=""; }

function sendOrder(){
  var name=document.getElementById("name").value.trim();
  var address=document.getElementById("address").value.trim();
  if(!name || !address){ alert("Please enter your name and address."); return; }
  var msg="*New AMBER order*\n\n";
  for(var k in cart){ var p=find(k); msg+="- "+p.name+" x"+cart[k]+" = "+fmt(p.price*cart[k])+"\n"; }
  msg+="\n*Total: "+fmt(totalPrice())+"*\n\n";
  msg+="Name: "+name+"\n";
  msg+="Delivery: "+document.getElementById("delivery").value+"\n";
  msg+="Address: "+address+"\n";
  msg+="Payment: "+document.getElementById("payment").value;
  window.location.href="https://wa.me/"+PHONE+"?text="+encodeURIComponent(msg);
}

drawFilters(); drawProducts(); update();
</script>
</body>
</html>
